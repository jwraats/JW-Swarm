[package]
name = "jw-swarm-fleet-manager"
version = "0.1.0"
edition = "2024"
description = "JW Swarm Fleet Manager — orchestrator for the distributed inference fleet"
license = "MIT"

[[bin]]
name = "jw-swarm-fleet-manager"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# cargo-deb metadata: `cargo deb` produces a Debian package.
[package.metadata.deb]
maintainer = "JW Swarm <noreply@example.com>"
copyright = "2026, JW Swarm"
license-file = ["../LICENSE", "0"]
extended-description = "Fleet Manager orchestrator for the JW Swarm distributed LLM inference cluster."
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/jw-swarm-fleet-manager", "usr/bin/", "755"],
    ["config/models.toml", "etc/jw-swarm/models.toml", "644"],
    ["SETUP.md", "usr/share/doc/jw-swarm-fleet-manager/SETUP.md", "644"],
]
conf-files = ["/etc/jw-swarm/models.toml"]
systemd-units = { unit-name = "jw-swarm-fleet-manager", unit-scripts = "packaging/debian", enable = false }
