<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"></stop>
      <stop offset="100%" stop-color="#1f2937"></stop>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"></stop>
      <stop offset="100%" stop-color="#a78bfa"></stop>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"></feDropShadow>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"></rect>

  <!-- Neural network nodes -->
  <g opacity="0.18" stroke="#ffffff" stroke-width="4">
    <line x1="110" y1="120" x2="256" y2="256"></line>
    <line x1="402" y1="120" x2="256" y2="256"></line>
    <line x1="150" y1="392" x2="256" y2="256"></line>
    <line x1="362" y1="392" x2="256" y2="256"></line>

    <circle cx="110" cy="120" r="10" fill="#ffffff"></circle>
    <circle cx="402" cy="120" r="10" fill="#ffffff"></circle>
    <circle cx="150" cy="392" r="10" fill="#ffffff"></circle>
    <circle cx="362" cy="392" r="10" fill="#ffffff"></circle>
    <circle cx="256" cy="256" r="14" fill="#ffffff"></circle>
  </g>

  <!-- JW Lettermark -->
  <g fill="none" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- J -->
    <path d="M180 150v130c0 45-24 72-68 72"></path>
    
    <!-- W -->
    <path d="M250 150l34 210 44-120 44 120 34-210"></path>
  </g>

  <!-- Weight-inspired bars -->
  <g fill="url(#accent)" opacity="0.9">
    <rect x="88" y="228" width="20" height="56" rx="10"></rect>
    <rect x="404" y="228" width="20" height="56" rx="10"></rect>
  </g>
</svg>