[package]
name = "jw-swarm-node"
version = "0.1.0"
edition = "2021"
description = "JW Swarm inference node agent (Linux CLI + systemd service)"
license = "MIT"

[[bin]]
name = "jw-swarm-node"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "5"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tokio-rustls = "0.26"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.29"
url = "2"
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["tls12", "ring"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "1"

[package.metadata.deb]
maintainer = "JW Swarm <noreply@example.com>"
copyright = "2026, JW Swarm"
license-file = ["../../LICENSE", "0"]
extended-description = "Inference node agent for the JW Swarm distributed LLM inference cluster."
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/jw-swarm-node", "usr/bin/", "755"],
]
systemd-units = { unit-name = "jw-swarm-node", unit-scripts = "packaging/debian", enable = false }
