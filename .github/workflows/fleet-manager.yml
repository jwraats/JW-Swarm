name: Fleet Manager

on:
  push:
    branches: [main]
    paths:
      - "jw-swarm-fleet-manager/**"
      - "proto/**"
      - ".github/workflows/fleet-manager.yml"
    tags:
      - "fleet-manager-v*"
  pull_request:
    paths:
      - "jw-swarm-fleet-manager/**"
      - "proto/**"
      - ".github/workflows/fleet-manager.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: jw-swarm-fleet-manager

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: jw-swarm-fleet-manager
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: jw-swarm-fleet-manager-linux-x86_64
          path: jw-swarm-fleet-manager/target/release/jw-swarm-fleet-manager

  debian-package:
    name: Debian package
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: jw-swarm-fleet-manager
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: jw-swarm-fleet-manager-deb
          path: jw-swarm-fleet-manager/target/debian/*.deb

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: debian-package
    if: startsWith(github.ref, 'refs/tags/fleet-manager-v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: jw-swarm-fleet-manager-deb
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
