name: Release — Nodes

# Triggered only by pushing a tag like `nodes-v0.1.0`.
# No `paths` filter here: tag pushes do not reliably match path filters,
# so release triggers are kept separate from the path-scoped CI workflow.
on:
  push:
    tags:
      - "nodes-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Linux ----
  linux:
    name: Linux node (.deb)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jw-swarm-nodes/linux
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: jw-swarm-nodes/linux
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: jw-swarm-node-deb
          path: jw-swarm-nodes/linux/target/debian/*.deb

  # ---------------------------------------------------------------- macOS ----
  macos:
    name: macOS node (.dmg/.pkg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for project
        id: check
        run: |
          if ls jw-swarm-nodes/macos/*.xcodeproj jw-swarm-nodes/macos/Package.swift >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS node project not present yet (Phase 4); skipping build."
          fi
      - name: Build & package (.dmg/.pkg)
        if: steps.check.outputs.present == 'true'
        working-directory: jw-swarm-nodes/macos
        run: |
          if [ -f Package.swift ]; then
            swift build -c release
          else
            xcodebuild -scheme JWSwarmNode -configuration Release
          fi
      - name: Upload macOS package
        if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: jw-swarm-node-macos
          path: jw-swarm-nodes/macos/build/**/*.{dmg,pkg,app}
          if-no-files-found: ignore

  # -------------------------------------------------------------- Windows ----
  windows:
    name: Windows node (.msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for project
        id: check
        shell: pwsh
        run: |
          if (Get-ChildItem -Path jw-swarm-nodes/windows -Recurse -Include *.sln,*.csproj -ErrorAction SilentlyContinue) {
            "present=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "present=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Output "::notice::Windows node project not present yet (Phase 5); skipping build."
          }
      - name: Setup .NET
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build & package (.msi)
        if: steps.check.outputs.present == 'true'
        working-directory: jw-swarm-nodes/windows
        run: dotnet build -c Release
      - name: Upload Windows package
        if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: jw-swarm-node-windows
          path: jw-swarm-nodes/windows/**/bin/Release/**/*.{msi,exe}
          if-no-files-found: ignore

  # -------------------------------------------------------------- Release ----
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
